<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kompass</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2323637f'/><circle cx='32' cy='32' r='21' fill='none' stroke='%23dbe9f0' stroke-width='3.5'/><path d='M32 13l6.5 19L32 51l-6.5-19z' fill='%23ffffff'/><circle cx='32' cy='32' r='3' fill='%2323637f'/></svg>">
<style>
/* Kompass
 * Layout: feste Seitenleiste mit Listen links, eine ruhige Arbeitsspalte rechts.
 * Auf dem Handy wird die Seitenleiste zur waagerechten Leiste oben. */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --surface-2: #eceff3;
  --line: #dbe0e7;
  --fg: #17202b;
  --fg-muted: #586373;
  --fg-faint: #8b94a2;
  --accent: #23637f;
  --accent-fg: #ffffff;
  --accent-soft: #dbe9f0;
  --warn: #9a5b0c;
  --warn-soft: #f7ead6;
  --danger: #ad352c;
  --danger-soft: #f6dfdb;
  --ok: #2b7a4c;
  --src-jira: #1d63cf;
  --src-confluence: #2556a8;
  --src-teams: #5459bd;
  --src-mail: #0b67b2;
  --src-sharepoint: #0f7c7c;
  --shadow: 0 12px 32px rgba(18, 30, 45, .16), 0 2px 6px rgba(18, 30, 45, .08);

  --font-ui: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "Cascadia Mono", "Cascadia Code", ui-monospace, "SF Mono", Consolas, monospace;

  --radius: 8px;
  --side-w: 236px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101317;
    --surface: #171b21;
    --surface-2: #1f242c;
    --line: #2a313b;
    --fg: #e5e9ee;
    --fg-muted: #9ba5b3;
    --fg-faint: #687180;
    --accent: #72b4d3;
    --accent-fg: #0b1820;
    --accent-soft: #1a3340;
    --warn: #e2a65a;
    --warn-soft: #362914;
    --danger: #ee8b81;
    --danger-soft: #3b1e1b;
    --ok: #7cc79a;
    --src-jira: #79aaff;
    --src-confluence: #8fb0f0;
    --src-teams: #a3a6ff;
    --src-mail: #69b2ec;
    --src-sharepoint: #5fc4c4;
    --shadow: 0 12px 32px rgba(0, 0, 0, .55), 0 2px 6px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101317;
  --surface: #171b21;
  --surface-2: #1f242c;
  --line: #2a313b;
  --fg: #e5e9ee;
  --fg-muted: #9ba5b3;
  --fg-faint: #687180;
  --accent: #72b4d3;
  --accent-fg: #0b1820;
  --accent-soft: #1a3340;
  --warn: #e2a65a;
  --warn-soft: #362914;
  --danger: #ee8b81;
  --danger-soft: #3b1e1b;
  --ok: #7cc79a;
  --src-jira: #79aaff;
  --src-confluence: #8fb0f0;
  --src-teams: #a3a6ff;
  --src-mail: #69b2ec;
  --src-sharepoint: #5fc4c4;
  --shadow: 0 12px 32px rgba(0, 0, 0, .55), 0 2px 6px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 14px/1.45 var(--font-ui);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
kbd {
  font: 11px/1 var(--font-mono);
  padding: 3px 5px;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 4px;
  color: var(--fg-muted);
  background: var(--surface);
  white-space: nowrap;
}
code { font: 12.5px var(--font-mono); background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- Gerüst */
.shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
#sidebar {
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; gap: 14px;
  padding: 18px 12px;
  border-right: 1px solid var(--line);
  background: var(--surface);
  overflow-y: auto;
}
#main { min-width: 0; padding-block: 28px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.main-inner { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

.brand { display: flex; align-items: center; gap: 9px; padding: 2px 8px; font: 600 17px/1 var(--font-display); letter-spacing: -.01em; }
.brand-mark { width: 22px; height: 22px; flex: none; }
.brand-mark circle { fill: none; stroke: var(--fg-muted); stroke-width: 2; }
.brand-mark path { fill: var(--accent); }

.search {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 7px 8px 7px 10px; border: 1px solid var(--line); border-radius: var(--radius);
  background: var(--bg); color: var(--fg-faint); cursor: pointer; text-align: left;
}
.search:hover { border-color: var(--fg-faint); }

.nav { display: flex; flex-direction: column; gap: 1px; }
.nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: 6px; border: 0; background: none;
  color: var(--fg-muted); text-decoration: none; cursor: pointer; text-align: left; width: 100%;
}
.nav-item:hover { background: var(--surface-2); color: var(--fg); }
.nav-item.is-active { background: var(--accent-soft); color: var(--fg); font-weight: 600; }
.nav-item.drop-target { outline: 2px dashed var(--accent); outline-offset: -2px; }
.nav-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-key { opacity: 0; transition: opacity .15s; }
.nav-item:hover .nav-key { opacity: 1; }
.nav-item.small { font-size: 13px; padding: 5px 10px; }
.badge { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--fg-faint); min-width: 18px; text-align: right; }
.badge.is-strong { color: var(--accent-fg); background: var(--accent); border-radius: 10px; padding: 0 7px; font-weight: 600; text-align: center; }
.badge.is-warn { color: var(--warn); font-weight: 700; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 1px; border-top: 1px solid var(--line); padding-top: 10px; }

.side-timer {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 6px;
  padding: 8px 8px 8px 10px; border-radius: var(--radius); background: var(--accent-soft);
}
.side-timer-main { display: flex; flex-direction: column; min-width: 0; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; }
.side-timer-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); font-weight: 600; }
.side-timer-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
.side-timer-clock { font: 600 13px var(--font-mono); font-variant-numeric: tabular-nums; }

/* ---------- Kopf der Ansicht */
.view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.view-head h1 { margin: 0; font: 600 26px/1.2 var(--font-display); letter-spacing: -.015em; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--fg-muted); max-width: 60ch; }
.focus-meter { min-width: 190px; display: flex; flex-direction: column; gap: 6px; }
.focus-meter-num { font: 600 20px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.focus-meter-num small { font: 400 12px var(--font-ui); color: var(--fg-muted); margin-left: 4px; }
.meter { height: 5px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .4s; }

/* ---------- Banner */
.banner {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 10px 12px 10px 14px; border-radius: var(--radius);
  background: var(--accent-soft); color: var(--fg);
}
.banner.is-warn { background: var(--warn-soft); }
.banner.is-danger { background: var(--danger-soft); }
.banner-actions { display: flex; gap: 6px; }

/* ---------- Knöpfe */
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); cursor: pointer; text-decoration: none; font-weight: 500;
}
.btn:hover { border-color: var(--fg-faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary kbd { background: transparent; color: inherit; border-color: currentColor; opacity: .7; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--fg-muted); }
.btn.ghost:hover { background: var(--surface-2); color: var(--fg); }
.btn.danger { color: var(--danger); }
.btn.danger-solid { background: var(--danger); border-color: var(--danger); color: var(--surface); }
.btn.small { padding: 3px 8px; font-size: 13px; }
.btn.big { padding: 9px 16px; font-size: 15px; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- Schnelleingabe */
.quick-add { position: relative; }
.quick-add input {
  width: 100%; padding: 11px 44px 11px 14px;
  border: 1px dashed var(--line); border-radius: var(--radius);
  background: var(--surface); outline: none;
}
.quick-add input:focus { border-style: solid; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.quick-add input::placeholder { color: var(--fg-faint); }
.kbd-hint { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); pointer-events: none; }
.quick-add input:focus + .kbd-hint { display: none; }
.triage-hint { margin: -6px 0 0; color: var(--fg-muted); font-size: 13px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }

/* ---------- Aufgaben */
.section { display: flex; flex-direction: column; gap: 10px; }
.section-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.section-title, .section-toggle {
  margin: 4px 0 0; display: flex; align-items: baseline; gap: 8px;
  font: 600 12px/1.2 var(--font-ui); text-transform: uppercase; letter-spacing: .07em; color: var(--fg-muted);
}
.section-title span, .section-toggle span { color: var(--fg-faint); font-variant-numeric: tabular-nums; }
.section-title em { font-style: normal; text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--fg-faint); margin-left: auto; }
.section-title.is-warn { color: var(--warn); }
.section-toggle { border: 0; background: none; padding: 0; cursor: pointer; }
.section-toggle::before { content: "▸"; font-size: 11px; transition: transform .15s; }
.section-toggle[aria-expanded="true"]::before { transform: rotate(90deg); }

.tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.task {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px;
  padding: 9px 10px 9px 12px; border-top: 1px solid var(--line); position: relative;
}
.task:first-child { border-top: 0; }
.task:hover { background: var(--bg); }
.task.is-selected { background: var(--accent-soft); }
.task.is-selected::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); }
.task.is-running .task-title { font-weight: 600; }
.task.is-dragging { opacity: .4; }
.task.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
.task.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
.task-main { min-width: 0; cursor: default; display: flex; flex-direction: column; gap: 4px; }
.task-title { overflow-wrap: anywhere; }
.task.is-done .task-title { color: var(--fg-faint); text-decoration: line-through; }
.task-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.check {
  width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--fg-faint);
  background: transparent; padding: 0; cursor: pointer; display: grid; place-items: center; flex: none;
}
.check svg { width: 12px; height: 12px; fill: none; stroke: var(--accent-fg); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.check:hover { border-color: var(--ok); }
.check:hover svg { opacity: .5; stroke: var(--ok); }
.check.is-checked { background: var(--ok); border-color: var(--ok); }
.check.is-checked svg { opacity: 1; stroke: var(--surface); }

.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 12px; line-height: 1.5; padding: 0 7px; border-radius: 4px;
  background: var(--surface-2); color: var(--fg-muted); white-space: nowrap; text-decoration: none;
  max-width: 100%; overflow: hidden; text-overflow: ellipsis;
}
.chip .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.chip.src { font-weight: 600; background: transparent; border: 1px solid var(--line); }
a.chip.src:hover { border-color: currentColor; }
.src-jira { color: var(--src-jira); }
.src-confluence { color: var(--src-confluence); }
.src-teams { color: var(--src-teams); }
.src-mail { color: var(--src-mail); }
.src-sharepoint { color: var(--src-sharepoint); }
.src-web { color: var(--fg-muted); }
.chip.person { color: var(--fg); }
.chip.person::before { content: "→"; color: var(--fg-faint); }
.chip.follow.is-due { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.chip.follow.is-late { background: var(--danger-soft); color: var(--danger); font-weight: 600; }
.chip.age { color: var(--warn); background: transparent; padding-left: 0; }
.chip.time { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.chip.time.is-running { background: var(--accent); color: var(--accent-fg); }
.chip.example { background: transparent; border: 1px dashed var(--line); color: var(--fg-faint); }

.task-actions { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; justify-content: flex-end; }
.tbtn, .ibtn {
  border: 1px solid transparent; background: transparent; color: var(--fg-muted);
  border-radius: 5px; cursor: pointer; font-size: 12.5px;
}
.tbtn { padding: 3px 7px; }
.ibtn { width: 28px; height: 28px; display: grid; place-items: center; font-size: 12px; }
.tbtn:hover, .ibtn:hover { background: var(--surface-2); color: var(--fg); border-color: var(--line); }
.ibtn.is-on { color: var(--accent); }
@media (hover: hover) {
  .task .task-actions { opacity: 0; transition: opacity .12s; }
  .task:hover .task-actions, .task.is-selected .task-actions, .task:focus-within .task-actions, .task.is-running .task-actions { opacity: 1; }
}

.empty { color: var(--fg-muted); margin: 0; padding: 22px 16px; border: 1px dashed var(--line); border-radius: var(--radius); text-align: center; }

/* ---------- Fokus */
.main-inner.is-focus { max-width: 680px; padding-top: 4vh; }
.focus { display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
.focus-back { margin-bottom: 8px; }
.eyebrow { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); font-weight: 600; }
.focus-title { margin: 0; font: 600 32px/1.2 var(--font-display); letter-spacing: -.02em; text-wrap: balance; overflow-wrap: anywhere; }
.focus-clock { font: 300 64px/1 var(--font-mono); font-variant-numeric: tabular-nums; color: var(--fg-faint); margin-top: 10px; letter-spacing: -.02em; }
.focus-clock.is-running { color: var(--fg); }
.focus-total { margin: 0; color: var(--fg-muted); }
.focus-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 10px; }
.focus-notes-label { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--fg-muted); font-weight: 600; }
.focus-notes {
  width: 100%; min-height: 180px; resize: vertical; padding: 12px 14px;
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); line-height: 1.55;
}
.pick { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.pick-item {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left;
  padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); cursor: pointer; font-size: 15px;
}
.pick-item:hover { border-color: var(--accent); }

/* ---------- Einstellungen */
.card { display: flex; flex-direction: column; gap: 12px; padding: 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.card h2 { margin: 0; font: 600 16px var(--font-display); }
.card h3 { margin: 0 0 4px; font-size: 14px; }
.howto p { margin: 0; color: var(--fg-muted); max-width: 65ch; }
.howto { padding-top: 10px; border-top: 1px solid var(--line); }
.muted { color: var(--fg-muted); margin: 0; max-width: 65ch; }
.muted.small, .small { font-size: 12.5px; }
.field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
.field > span { font-size: 12.5px; color: var(--fg-muted); font-weight: 500; }
.field input, .field select, .field textarea, .area-row input[type=text], .area-add input {
  padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); width: 100%; min-width: 0;
}
.field input:focus, .field select:focus, .field textarea:focus, .area-row input:focus, .area-add input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field textarea { resize: vertical; line-height: 1.5; }
.field input[type=number] { max-width: 120px; }
.field-row { display: flex; gap: 12px; flex-wrap: wrap; }
.field-row .field { min-width: 180px; }
.seg { display: inline-flex; padding: 3px; border-radius: 8px; background: var(--surface-2); gap: 2px; align-self: flex-start; flex-wrap: wrap; }
.seg-btn { border: 0; background: transparent; padding: 5px 12px; border-radius: 6px; cursor: pointer; color: var(--fg-muted); }
.seg-btn.is-on { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 600; }
.areas { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.area-row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.area-row input[type=color] { width: 34px; height: 32px; padding: 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); cursor: pointer; }
.area-add { display: flex; gap: 8px; }
.bookmarklet {
  display: inline-block; padding: 7px 14px; border-radius: 6px; cursor: grab;
  background: var(--accent); color: var(--accent-fg); text-decoration: none; font-weight: 600;
}

/* ---------- Overlays */
.backdrop {
  position: fixed; inset: 0; z-index: 50; background: rgba(10, 16, 24, .45);
  display: flex; align-items: flex-start; justify-content: center;
  padding: max(8vh, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
  overflow-y: auto;
}
.modal, .palette { width: 100%; max-width: 560px; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.modal-form { display: flex; flex-direction: column; gap: 12px; padding: 20px; }
.modal-form h2 { margin: 0; font: 600 18px var(--font-display); }
.modal-form p { margin: 0; }
.modal-btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 4px; }
.modal-btns .spacer { flex: 1; }
.keys { border-collapse: collapse; width: 100%; }
.keys td { padding: 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.keys td:first-child { width: 42%; padding-right: 12px; }

.palette { max-width: 620px; overflow: hidden; }
.palette input { width: 100%; border: 0; border-bottom: 1px solid var(--line); padding: 16px 18px; font-size: 16px; background: transparent; outline: none; }
.palette-list { list-style: none; margin: 0; padding: 6px; max-height: 55vh; overflow-y: auto; }
.palette-item { display: flex; justify-content: space-between; gap: 12px; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
.palette-item.is-active { background: var(--accent-soft); }
.palette-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette-kind { color: var(--fg-faint); font-size: 12px; flex: none; }
.palette-empty { padding: 14px 12px; color: var(--fg-muted); }

#toasts {
  position: fixed; z-index: 60; left: 50%; transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 8px; align-items: center; width: max-content; max-width: calc(100vw - 32px);
}
.toast {
  display: flex; align-items: center; gap: 14px; padding: 9px 10px 9px 14px; border-radius: 8px;
  background: var(--fg); color: var(--bg); box-shadow: var(--shadow); max-width: 100%;
  animation: toast-in .18s ease-out;
}
.toast span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

      { title: 'Frage aus dem Vertrieb zum Release-Termin beantworten', list: 'inbox', url: 'https://teams.microsoft.com/l/message/19:beispiel/1700000000000', source: 'teams' },
      { title: 'Sprint-Ziel für das Review vorbereiten', list: 'today', areaId: area(0) },
      { title: 'Roadmap Q1 auf Confluence aktualisieren', list: 'today', areaId: area(0), url: 'https://deinefirma.atlassian.net/wiki/spaces/PROD/pages/123456/Roadmap+Q1', source: 'confluence' },
      { title: 'Rückmeldung an den Einkauf zu Lizenzkosten', list: 'today', areaId: area(2), source: 'mail' },
      { title: 'Top-5-Stories für das nächste Refinement auswählen', list: 'week', areaId: area(1) },
      { title: 'Stakeholder-Map aktualisieren', list: 'later', areaId: area(2) },

      { title: 'Grobschätzung API-Anbindung', list: 'waiting', person: 'Dev-Team', followUp: dayKey(addWorkdays(today, 2)), areaId: area(1), url: 'https://deinefirma.atlassian.net/browse/SHOP-155', source: 'jira', sourceKey: 'SHOP-155' },
      { title: 'Priorität des Login-Bugs auf Mobile klären', list: 'agenda', person: 'Tech Lead', areaId: area(1) },
      { title: 'Feedback zur neuen Story-Vorlage einholen', list: 'agenda', person: 'Team-Retro', areaId: area(3) }

    ex.forEach(function (f, i) {

    });
    var doneTask = newTask({ title: 'Release Notes 4.2 abgestimmt', list: 'today', done: true, doneAt: nowIso(), example: true, areaId: area(0) });
    s.tasks.push(doneTask);
    var start = new Date(); start.setHours(Math.max(0, start.getHours() - 2), 5, 0, 0);
    var end = new Date(start.getTime() + 50 * 60000);
    if (end > new Date()) { start = new Date(Date.now() - 55 * 60000); end = new Date(Date.now() - 5 * 60000); }
    s.timeEntries.push({ id: uid(), taskId: doneTask.id, start: start.toISOString(), end: end.toISOString(), example: true, createdAt: nowIso(), updatedAt: nowIso() });
  }

  function migrate(s) {
    var base = emptyState();
    if (!s || typeof s !== 'object') return base;
    s.schema = SCHEMA;
    s.tasks = Array.isArray(s.tasks) ? s.tasks : [];
    s.areas = Array.isArray(s.areas) ? s.areas : base.areas;
    s.timeEntries = Array.isArray(s.timeEntries) ? s.timeEntries : [];
    s.settings = Object.assign({}, base.settings, s.settings || {});
    if (!s.createdAt) s.createdAt = nowIso();

    s.tasks = s.tasks.map(function (t) { return newTask(t); });

    var cutoff = Date.now() - 30 * 864e5;

    openIn: function (list) {

      return t;
    },
    updateTask: function (id, fields) {

      if (done && state.activeTimer && state.activeTimer.taskId === id) store.stopTimer(true);
      t.done = done;
      t.doneAt = done ? nowIso() : null;
      t.updatedAt = nowIso();
      store.commit();
    },
    deleteTask: function (id) {
      var t = store.task(id);
      if (!t) return;
      if (state.activeTimer && state.activeTimer.taskId === id) store.stopTimer(true);
      t.deletedAt = nowIso(); t.updatedAt = t.deletedAt;
      store.commit();
    },
    reorder: function (list, orderedIds) {

      });
      store.commit();
    },
    removeExamples: function () {
      state.tasks = state.tasks.filter(function (t) { return !t.example; });
      state.timeEntries = state.timeEntries.filter(function (e) { return !e.example; });
      if (state.activeTimer && !store.task(state.activeTimer.taskId)) state.activeTimer = null;
      store.commit();
    },
    hasExamples: function () { return store.tasks().some(function (t) { return t.example; }); },
    people: function () {
      var seen = {};
      store.tasks().forEach(function (t) { if (t.person) seen[t.person] = true; });
      return Object.keys(seen).sort(function (a, b) { return a.localeCompare(b, 'de'); });
    },

    // ---- Bereiche ----
    areas: function () { return state.areas.slice().sort(function (a, b) { return a.order - b.order; }); },
    area: function (id) { return state.areas.find(function (a) { return a.id === id; }) || null; },
    addArea: function (name, color) {
      var t = nowIso();
      state.areas.push({ id: uid(), name: name, color: color || '#7a8490', order: state.areas.length, createdAt: t, updatedAt: t });
      store.commit();
    },
    updateArea: function (id, fields) {
      var a = store.area(id); if (!a) return;
      Object.assign(a, fields, { updatedAt: nowIso() });
      store.commit();
    },
    deleteArea: function (id) {
      state.areas = state.areas.filter(function (a) { return a.id !== id; });

      store.commit();
    },

    // ---- Zeiterfassung ----
    startTimer: function (taskId) {
      if (state.activeTimer) store.stopTimer(true);
      state.activeTimer = { taskId: taskId, start: nowIso() };
      store.commit();
    },
    stopTimer: function (silent) {
      var a = state.activeTimer;
      if (!a) return;
      var end = nowIso();

    secondsOnDay: function (day) {
      var from = new Date(day + 'T00:00:00').getTime(), to = from + 864e5;

      var sum = 0;
      state.timeEntries.forEach(function (e) { if (e.taskId === taskId) sum += (new Date(e.end) - new Date(e.start)) / 1000; });

<script>
/* Kompass – erkennt, woher ein Link oder eine Datei kommt,
 * und schlägt einen brauchbaren Titel vor. */
(function (K) {
  'use strict';

  var SOURCES = {
    jira: { label: 'Jira' },
    confluence: { label: 'Confluence' },
    teams: { label: 'Teams' },
    mail: { label: 'Mail' },
    sharepoint: { label: 'SharePoint' },
    web: { label: 'Link' }
  };

  var URL_RE = /https?:\/\/[^\s<>"']+/i;

  function safeDecode(s) {
    try { return decodeURIComponent(s.replace(/\+/g, ' ')); } catch (e) { return s.replace(/\+/g, ' '); }
  }

  function detect(url) {
    var u;
    try { u = new URL(url); } catch (e) { return { source: 'web', key: '', suggestion: url }; }
    var host = u.hostname.toLowerCase();
    var path = u.pathname;

    if (/(^|\.)atlassian\.net$/.test(host) || /jira/.test(host) || /confluence/.test(host)) {
      if (/\/wiki\//.test(path) || /confluence/.test(host)) {
        var m = path.match(/\/pages\/\d+\/([^/]+)/);
        return { source: 'confluence', key: '', suggestion: m ? safeDecode(m[1]) : 'Confluence-Seite' };
      }
      var key = '';
      var mk = path.match(/\/browse\/([A-Z][A-Z0-9_]+-\d+)/i);
      if (mk) key = mk[1].toUpperCase();
      var sel = u.searchParams.get('selectedIssue');
      if (!key && sel) key = sel.toUpperCase();
      return { source: 'jira', key: key, suggestion: key || 'Jira-Ticket' };
    }
    if (/teams\.(microsoft|cloud\.microsoft|live)\.com$/.test(host) || host === 'teams.cloud.microsoft') {
      return { source: 'teams', key: '', suggestion: 'Teams-Nachricht' };
    }
    if (/^outlook\.(office|office365|live)\.com$/.test(host) || host === 'outlook.cloud.microsoft') {
      return { source: 'mail', key: '', suggestion: 'Mail' };
    }
    if (/\.sharepoint\.com$/.test(host)) {
      var file = safeDecode(path.split('/').filter(Boolean).pop() || '');
      return { source: 'sharepoint', key: '', suggestion: file || 'Dokument' };
    }
    return { source: 'web', key: '', suggestion: host.replace(/^www\./, '') };
  }

  /* Seitentitel aus Jira/Confluence/Teams/Outlook säubern */
  function cleanTitle(title, source, key) {
    var t = String(title || '').trim();
    var isConfluence = /\s[-|–]\s*Confluence\s*$/i.test(t) || source === 'confluence';
    t = t.replace(/\s*[-|–]\s*(Jira|Confluence|Microsoft Teams|Teams|Outlook|Mail|SharePoint)\s*$/i, '');
    // Confluence hängt den Bereichsnamen an: "Seite - Bereich - Confluence"
    if (isConfluence) t = t.replace(/\s+[-–]\s+[^-–]{1,60}$/, '');
    if (key) t = t.replace(new RegExp('^\\[?' + key + '\\]?\\s*[:\\-–]?\\s*'), '');
    return t.trim();
  }

  /* Freitext mit oder ohne Link in Aufgabenfelder zerlegen */
  function parse(text, jiraBase) {
    text = String(text || '').trim();
    var m = text.match(URL_RE);
    if (!m) {
      // "SHOP-142 Text" wird zum Jira-Link, wenn die Jira-Adresse hinterlegt ist
      var jk = text.match(/^([A-Z][A-Z0-9_]{1,14}-\d{1,7})\b[\s:–-]*(.*)$/);
      if (jk && jiraBase) {
        return { title: jk[2] || jk[1], url: jiraBase.replace(/\/+$/, '') + '/browse/' + jk[1], source: 'jira', sourceKey: jk[1] };
      }
      return { title: text, url: '', source: '', sourceKey: '' };
    }
    var url = m[0].replace(/[).,;]+$/, '');
    var rest = (text.slice(0, m.index) + ' ' + text.slice(m.index + m[0].length)).replace(/\s+/g, ' ').trim();
    var d = detect(url);
    return { title: rest || d.suggestion, url: url, source: d.source, sourceKey: d.key };
  }

  /* Betreff und Absender aus einer .eml-Datei lesen */
  function decodeWords(s) {
    return s.replace(/=\?([^?]+)\?([bBqQ])\?([^?]*)\?=/g, function (_, charset, enc, data) {
      try {
        var bytes;
        if (enc.toUpperCase() === 'B') {
          var bin = atob(data);
          bytes = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        } else {
          var q = data.replace(/_/g, ' ');
          var arr = [];
          for (var j = 0; j < q.length; j++) {
            if (q[j] === '=' && /[0-9A-F]{2}/i.test(q.substr(j + 1, 2))) { arr.push(parseInt(q.substr(j + 1, 2), 16)); j += 2; }
            else arr.push(q.charCodeAt(j));

      } catch (e) { return data; }

  }
  function parseEml(text) {
    var head = text.split(/\r?\n\r?\n/)[0].replace(/\r?\n[ \t]+/g, ' ');
    var get = function (name) {
      var m = head.match(new RegExp('^' + name + ':\\s*(.*)$', 'im'));
      return m ? decodeWords(m[1]).trim() : '';

  }

})(window.K = window.K || {});

    { id: 'heute', label: 'Heute', key: '2', list: 'today' },
    { id: 'woche', label: 'Diese Woche', key: '3', list: 'week', hint: 'Steht an, aber nicht heute.' },
    { id: 'spaeter', label: 'Später', key: '4', list: 'later', hint: 'Irgendwann, ohne Termin. Einmal pro Woche durchsehen.' },
    { id: 'warten', label: 'Warten auf', key: '5', list: 'waiting', hint: 'Liegt bei jemand anderem. Mit Datum, wann du nachfasst.' },
    { id: 'agenda', label: 'Agenda', key: '6', list: 'agenda', hint: 'Themen, die du im nächsten Gespräch mit dieser Person ansprichst.' },
    { id: 'erledigt', label: 'Erledigt', key: '7' }
  ];
  var LIST_LABEL = { inbox: 'Inbox', today: 'Heute', week: 'Diese Woche', later: 'Später', waiting: 'Warten auf', agenda: 'Agenda' };
  var TRIAGE = [
    { list: 'today', key: 'H', label: 'Heute' },
    { list: 'week', key: 'W', label: 'Woche' },
    { list: 'later', key: 'S', label: 'Später' },
    { list: 'waiting', key: 'A', label: 'Warten' },
    { list: 'agenda', key: 'G', label: 'Agenda' }
  ];
  function viewById(id) { return VIEWS.find(function (v) { return v.id === id; }); }

  var ui = {
    view: 'heute',
    prevView: 'heute',
    selectedId: null,
    focusTaskId: null,
    modal: null,          // {type, ...}
    palette: null,        // {q, idx}
    showDoneToday: false
  };

  // ------------------------------------------------------------------ Theme
  function applyTheme() {
    var t = S.state.settings.theme;
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    else document.documentElement.removeAttribute('data-theme');
  }

  // ------------------------------------------------------------------ Toasts
  function toast(text, undoSnap) {
    var root = $('#toasts');
    var el = document.createElement('div');
    el.className = 'toast';
    el.setAttribute('role', 'status');
    el.innerHTML = '<span>' + esc(text) + '</span>' + (undoSnap ? '<button type="button" class="toast-undo">Rückgängig</button>' : '');
    root.appendChild(el);
    while (root.children.length > 3) root.removeChild(root.firstChild);
    var timer = setTimeout(function () { el.remove(); }, undoSnap ? 7000 : 3500);
    if (undoSnap) {
      el.querySelector('.toast-undo').addEventListener('click', function () {
        clearTimeout(timer); el.remove(); S.restore(undoSnap); toast('Rückgängig gemacht');
      });
    }
  }

  // ------------------------------------------------------------------ Bausteine
  function sourceChip(t) {
    if (!t.source && !t.url) return '';
    var src = L.SOURCES[t.source] || L.SOURCES.web;
    var label = t.sourceKey && t.sourceKey !== t.title ? src.label + ' ' + t.sourceKey : src.label;
    var cls = 'chip src src-' + esc(t.source || 'web');
    if (t.url) return '<a class="' + cls + '" href="' + esc(t.url) + '" target="_blank" rel="noopener" title="Quelle öffnen">' + esc(label) + ' ↗</a>';
    return '<span class="' + cls + '">' + esc(label) + '</span>';
  }
  function areaChip(t) {
    var a = t.areaId && S.area(t.areaId);
    if (!a) return '';
    return '<span class="chip area"><i class="dot" style="background:' + esc(a.color) + '"></i>' + esc(a.name) + '</span>';
  }
  function followChip(t) {
    if (t.list !== 'waiting' || !t.followUp) return '';
    var diff = daysBetween(U.dayKey(), t.followUp);
    var cls = 'chip follow', txt;
    if (diff < 0) { cls += ' is-late'; txt = 'Nachfassen seit ' + (-diff) + (diff === -1 ? ' Tag' : ' Tagen'); }
    else if (diff === 0) { cls += ' is-due'; txt = 'Heute nachfassen'; }
    else txt = 'Nachfassen ' + shortDate(t.followUp);
    return '<span class="' + cls + '">' + esc(txt) + '</span>';
  }
  function ageChip(t) {
    if (t.list !== 'today' || t.done) return '';
    var d = daysBetween(U.dayKey(t.listChangedAt), U.dayKey());
    if (d < 1) return '';
    return '<span class="chip age" title="Seit ' + d + (d === 1 ? ' Tag' : ' Tagen') + ' auf Heute">seit ' + esc(shortDate(U.dayKey(t.listChangedAt))) + '</span>';
  }
  function timeChip(t) {
    var sec = S.secondsOnTask(t.id);
    var running = S.state.activeTimer && S.state.activeTimer.taskId === t.id;
    if (!sec && !running) return '';
    return '<span class="chip time' + (running ? ' is-running' : '') + '"' + (running ? ' data-timer="task" data-task="' + esc(t.id) + '"' : '') + '>' + (running ? fmtClock(sec) : fmtDur(sec)) + '</span>';
  }

  function taskRow(t, opts) {
    opts = opts || {};
    var running = S.state.activeTimer && S.state.activeTimer.taskId === t.id;
    var sel = ui.selectedId === t.id;
    var meta = [areaChip(t), sourceChip(t), opts.hidePerson ? '' : (t.person && !opts.hidePerson ? '<span class="chip person">' + esc(t.person) + '</span>' : ''), followChip(t), ageChip(t), timeChip(t), t.example ? '<span class="chip example">Beispiel</span>' : ''].join('');
    var actions = '';
    if (!t.done) {
      if (t.list === 'inbox' || opts.triage) {
        actions += TRIAGE.filter(function (x) { return x.list !== t.list; }).map(function (x) {
          return '<button type="button" class="tbtn" data-act="move" data-id="' + esc(t.id) + '" data-list="' + x.list + '" title="' + x.label + ' (' + x.key + ')">' + x.label + '</button>';
        }).join('');
      }
      actions += '<button type="button" class="ibtn' + (running ? ' is-on' : '') + '" data-act="timer" data-id="' + esc(t.id) + '" title="' + (running ? 'Timer stoppen' : 'Timer starten') + ' (T)" aria-label="' + (running ? 'Timer stoppen' : 'Timer starten') + '">' + (running ? '❚❚' : '▶') + '</button>';
      actions += '<button type="button" class="ibtn" data-act="focus" data-id="' + esc(t.id) + '" title="Fokus (F)" aria-label="Fokus">◎</button>';
    } else {
      actions += '<button type="button" class="tbtn" data-act="undone" data-id="' + esc(t.id) + '">Wieder öffnen</button>';
    }
    actions += '<button type="button" class="ibtn" data-act="edit" data-id="' + esc(t.id) + '" title="Bearbeiten (E)" aria-label="Bearbeiten">⋯</button>';

    return '<li class="task' + (sel ? ' is-selected' : '') + (t.done ? ' is-done' : '') + (running ? ' is-running' : '') + '" data-id="' + esc(t.id) + '"' + (opts.draggable && !t.done ? ' draggable="true"' : '') + '>' +
      '<button type="button" class="check' + (t.done ? ' is-checked' : '') + '" data-act="' + (t.done ? 'undone' : 'done') + '" data-id="' + esc(t.id) + '" aria-label="' + (t.done ? 'Als offen markieren' : 'Erledigt') + '"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg></button>' +
      '<div class="task-main" data-act="select" data-id="' + esc(t.id) + '">' +
        '<div class="task-title">' + esc(t.title || '(ohne Titel)') + '</div>' +
        (meta ? '<div class="task-meta">' + meta + '</div>' : '') +
      '</div>' +
      '<div class="task-actions">' + actions + '</div>' +
    '</li>';
  }

  function taskList(tasks, opts) {
    opts = opts || {};
    if (!tasks.length) return opts.empty ? '<p class="empty">' + opts.empty + '</p>' : '';
    return '<ul class="tasks" data-list="' + esc(opts.list || '') + '">' + tasks.map(function (t) { return taskRow(t, opts); }).join('') + '</ul>';
  }

  function quickAdd(list, placeholder) {
    return '<form class="quick-add" data-list="' + list + '" autocomplete="off">' +
      '<label class="sr-only" for="quick-add">Neue Aufgabe</label>' +
      '<input id="quick-add" name="q" type="text" placeholder="' + esc(placeholder) + '" />' +
      '<span class="kbd-hint"><kbd>N</kbd></span>' +
    '</form>';
  }

  // ------------------------------------------------------------------ Banner
  function banners() {
    var out = '';
    if (S.saveError) {
      out += '<div class="banner is-danger"><span>Speichern im Browser ist fehlgeschlagen. Exportiere ein Backup, bevor du das Fenster schließt.</span><button type="button" class="btn" data-act="export">Backup exportieren</button></div>';
    }
    if (S.hasExamples()) {
      out += '<div class="banner"><span>Du siehst Beispieldaten, damit du die Abläufe ausprobieren kannst.</span><button type="button" class="btn" data-act="remove-examples">Beispiele entfernen</button></div>';
    } else if (needsBackupNag()) {
      var last = S.state.settings.lastBackupAt;
      out += '<div class="banner is-warn"><span>' + (last ? 'Letztes Backup am ' + esc(new Date(last).toLocaleDateString('de-DE')) + '.' : 'Noch kein Backup.') + ' Deine Daten liegen nur in diesem Browser.</span><span class="banner-actions"><button type="button" class="btn" data-act="export">Jetzt sichern</button><button type="button" class="btn ghost" data-act="snooze-backup">Später</button></span></div>';
    }
    return out;
  }
  function needsBackupNag() {
    var s = S.state.settings;
    if (!S.tasks().length) return false;
    if (s.backupSnoozedUntil && new Date(s.backupSnoozedUntil) > new Date()) return false;
    var ref = s.lastBackupAt || S.state.createdAt;
    return Date.now() - new Date(ref).getTime() > 7 * 864e5;
  }

  // ------------------------------------------------------------------ Seitenleiste
  function counts() {
    var c = { inbox: 0, today: 0, week: 0, later: 0, waiting: 0, agenda: 0, due: 0 };
    var today = U.dayKey();
    S.tasks().forEach(function (t) {
      if (t.done) return;
      c[t.list] = (c[t.list] || 0) + 1;
      if (t.list === 'waiting' && t.followUp && t.followUp <= today) c.due++;
    });
    return c;
  }
  function sidebarHTML() {
    var c = counts();
    var nav = VIEWS.map(function (v) {
      var n = v.list ? c[v.list] : 0;
      var badge = '';
      if (v.id === 'inbox' && n) badge = '<span class="badge is-strong">' + n + '</span>';
      else if (v.id === 'warten' && c.due) badge = '<span class="badge is-warn" title="Nachfassen fällig">' + c.due + '</span>';
      else if (n) badge = '<span class="badge">' + n + '</span>';
      return '<a href="#' + v.id + '" class="nav-item' + (ui.view === v.id ? ' is-active' : '') + '" data-act="nav" data-view="' + v.id + '"' + (v.list ? ' data-drop-list="' + v.list + '"' : '') + '>' +
        '<span class="nav-label">' + esc(v.label) + '</span>' + badge + '<kbd class="nav-key">' + v.key + '</kbd></a>';
    }).join('');

    var timer = '';
    var a = S.state.activeTimer;
    if (a) {
      var t = S.task(a.taskId);
      timer = '<div class="side-timer">' +
        '<button type="button" class="side-timer-main" data-act="focus" data-id="' + esc(a.taskId) + '"><span class="side-timer-label">Läuft</span><span class="side-timer-title">' + esc(t ? t.title : '') + '</span></button>' +
        '<span class="side-timer-clock" data-timer="active">' + fmtClock((Date.now() - new Date(a.start)) / 1000) + '</span>' +
        '<button type="button" class="ibtn is-on" data-act="timer-stop" title="Timer stoppen" aria-label="Timer stoppen">❚❚</button>' +
      '</div>';
    }

    return '<div class="brand"><svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13"/><path d="M16 6l3.2 10L16 26l-3.2-10z"/></svg><span>Kompass</span></div>' +
      '<button type="button" class="search" data-act="palette"><span>Suchen …</span><kbd>' + MOD + ' K</kbd></button>' +
      '<nav class="nav" aria-label="Listen">' + nav +
        '<a href="#fokus" class="nav-item' + (ui.view === 'fokus' ? ' is-active' : '') + '" data-act="nav" data-view="fokus"><span class="nav-label">Fokus</span><kbd class="nav-key">F</kbd></a>' +
      '</nav>' +
      timer +
      '<div class="side-foot">' +
        '<a href="#optionen" class="nav-item small' + (ui.view === 'optionen' ? ' is-active' : '') + '" data-act="nav" data-view="optionen"><span class="nav-label">Einstellungen</span></a>' +
        '<button type="button" class="nav-item small" data-act="help"><span class="nav-label">Tastenkürzel</span><kbd class="nav-key">?</kbd></button>' +
      '</div>';
  }

  // ------------------------------------------------------------------ Ansichten rendern
  function header(title, sub, right) {
    return '<header class="view-head"><div><h1>' + esc(title) + '</h1>' + (sub ? '<p class="sub">' + sub + '</p>' : '') + '</div>' + (right || '') + '</header>';
  }

  function viewList(v) {
    var tasks = S.openIn(v.list);
    var place = { inbox: 'Erfassen: Text oder Link einfügen, Enter', week: 'Für diese Woche …', later: 'Für später …' }[v.list];
    var body = place ? quickAdd(v.list, place) : '';
    if (v.list === 'inbox' && tasks.length) {
      body += '<p class="triage-hint">Sortieren: Aufgabe anklicken, dann <kbd>H</kbd> Heute · <kbd>W</kbd> Woche · <kbd>S</kbd> Später · <kbd>A</kbd> Warten · <kbd>G</kbd> Agenda · <kbd>Entf</kbd> Löschen</p>';
    }
    body += taskList(tasks, { list: v.list, draggable: true, empty: v.list === 'inbox' ? 'Inbox ist leer. Neues landet hier per Eingabe, Einfügen (' + MOD + '+V), Bookmarklet oder indem du eine Mail aus Outlook hierher ziehst.' : 'Nichts hier.' });
    return header(v.label, v.hint ? esc(v.hint) : '') + body;
  }

  function viewToday() {
    var today = U.dayKey();
    var focusSec = S.secondsOnDay(today);
    var target = Math.max(0.5, Number(S.state.settings.dailyFocusTarget) || 3) * 3600;
    var pct = Math.min(100, Math.round(focusSec / target * 100));
    var right = '<div class="focus-meter" title="Fokuszeit heute">' +
      '<div class="focus-meter-num"><span data-timer="today">' + fmtHours(focusSec) + '</span> h <small>von ' + fmtHours(target) + ' h Fokus</small></div>' +
      '<div class="meter"><i data-timer="today-bar" style="width:' + pct + '%"></i></div></div>';

    var due = S.tasks().filter(function (t) { return !t.done && t.list === 'waiting' && t.followUp && t.followUp <= today; })
      .sort(function (a, b) { return a.followUp.localeCompare(b.followUp); });
    var open = S.openIn('today');
    var doneToday = S.tasks().filter(function (t) { return t.done && t.doneAt && U.dayKey(t.doneAt) === today; })
      .sort(function (a, b) { return b.doneAt.localeCompare(a.doneAt); });

    var html = header(longDate(new Date()), '', right);
    if (due.length) {
      html += '<section class="section"><h2 class="section-title is-warn">Nachfassen fällig <span>' + due.length + '</span></h2>' +
        '<ul class="tasks">' + due.map(function (t) {
          return taskRow(t).replace('<div class="task-actions">', '<div class="task-actions"><button type="button" class="tbtn" data-act="follow-later" data-id="' + esc(t.id) + '" title="In 2 Arbeitstagen wieder">+2 Tage</button><button type="button" class="tbtn" data-act="move" data-list="today" data-id="' + esc(t.id) + '">Auf Heute</button>');
        }).join('') + '</ul></section>';
    }
    html += '<section class="section">' + quickAdd('today', 'Für heute … (#Bereich, Jira-Key oder Link möglich)') +
      taskList(open, { list: 'today', draggable: true, empty: 'Noch nichts für heute geplant. Hol dir etwas aus der Inbox oder aus „Diese Woche“.' }) + '</section>';
    if (doneToday.length) {
      html += '<section class="section"><button type="button" class="section-toggle" data-act="toggle-done-today" aria-expanded="' + ui.showDoneToday + '">Heute erledigt <span>' + doneToday.length + '</span></button>' +
        (ui.showDoneToday ? taskList(doneToday) : '') + '</section>';
    }
    return html;
  }

  function groupBy(tasks, keyFn) {
    var groups = {}, order = [];
    tasks.forEach(function (t) { var k = keyFn(t); if (!groups[k]) { groups[k] = []; order.push(k); } groups[k].push(t); });
    return order.map(function (k) { return { key: k, tasks: groups[k] }; });
  }

  function viewWaiting(v) {
    var tasks = S.openIn('waiting').sort(function (a, b) { return (a.followUp || '9999').localeCompare(b.followUp || '9999'); });
    var groups = groupBy(tasks, function (t) { return t.person || 'Ohne Person'; })
      .sort(function (a, b) { return (a.tasks[0].followUp || '9999').localeCompare(b.tasks[0].followUp || '9999'); });
    var html = header(v.label, esc(v.hint));
    if (!groups.length) return html + '<p class="empty">Du wartest gerade auf niemanden. Verschiebe eine Aufgabe mit <kbd>A</kbd> hierher.</p>';
    groups.forEach(function (g) {
      html += '<section class="section"><h2 class="section-title">' + esc(g.key) + ' <span>' + g.tasks.length + '</span></h2>' + taskList(g.tasks, { hidePerson: true }) + '</section>';
    });
    return html;
  }

  function viewAgenda(v) {
    var tasks = S.openIn('agenda');
    var groups = groupBy(tasks, function (t) { return t.person || 'Ohne Person'; })
      .sort(function (a, b) { return a.key.localeCompare(b.key, 'de'); });
    var html = header(v.label, esc(v.hint));
    if (!groups.length) return html + '<p class="empty">Keine offenen Gesprächsthemen. Verschiebe eine Aufgabe mit <kbd>G</kbd> hierher.</p>';
    groups.forEach(function (g) {
      html += '<section class="section"><div class="section-row"><h2 class="section-title">' + esc(g.key) + ' <span>' + g.tasks.length + '</span></h2>' +
        '<button type="button" class="btn ghost small" data-act="agenda-done" data-person="' + esc(g.key) + '">Alle besprochen</button></div>' +
        taskList(g.tasks, { hidePerson: true }) + '</section>';
    });
    return html;
  }

  function viewDone(v) {
    var tasks = S.tasks().filter(function (t) { return t.done; }).sort(function (a, b) { return (b.doneAt || '').localeCompare(a.doneAt || ''); });
    var html = header(v.label, 'Was du geschafft hast, nach Tagen.');
    if (!tasks.length) return html + '<p class="empty">Noch nichts erledigt.</p>';
    var today = U.dayKey();
    groupBy(tasks.slice(0, 300), function (t) { return U.dayKey(t.doneAt); }).forEach(function (g) {
      var label = g.key === today ? 'Heute' : (daysBetween(g.key, today) === 1 ? 'Gestern' : new Date(g.key + 'T12:00:00').toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' }));
      var sec = S.secondsOnDay(g.key);
      html += '<section class="section"><h2 class="section-title">' + esc(label) + ' <span>' + g.tasks.length + '</span>' + (sec ? '<em>' + fmtDur(sec) + ' Fokus</em>' : '') + '</h2>' + taskList(g.tasks) + '</section>';
    });
    return html;
  }

  function viewFocus() {
    var t = ui.focusTaskId && S.task(ui.focusTaskId);
    if (!t || t.done) {
      var cands = S.openIn('today');
      var html = header('Fokus', 'Was ist jetzt das Wichtigste? Wähle eine Aufgabe.');
      if (!cands.length) return html + '<p class="empty">Auf „Heute“ steht nichts. Plane zuerst deinen Tag.</p>';
      return html + '<ul class="pick">' + cands.map(function (c) {
        return '<li><button type="button" class="pick-item" data-act="focus" data-id="' + esc(c.id) + '"><span>' + esc(c.title) + '</span>' + areaChip(c) + '</button></li>';
      }).join('') + '</ul>';
    }
    var running = S.state.activeTimer && S.state.activeTimer.taskId === t.id;
    var session = running ? (Date.now() - new Date(S.state.activeTimer.start)) / 1000 : 0;
    var total = S.secondsOnTask(t.id);
    return '<div class="focus">' +
      '<button type="button" class="btn ghost small focus-back" data-act="focus-exit">← Zurück <kbd>Esc</kbd></button>' +
      '<p class="eyebrow">Fokus</p>' +
      '<h1 class="focus-title">' + esc(t.title) + '</h1>' +
      '<div class="task-meta focus-meta">' + areaChip(t) + sourceChip(t) + (t.person ? '<span class="chip person">' + esc(t.person) + '</span>' : '') + '</div>' +
      '<div class="focus-clock' + (running ? ' is-running' : '') + '" data-timer="session">' + fmtClock(session) + '</div>' +
      '<p class="focus-total">Insgesamt <span data-timer="task-total" data-task="' + esc(t.id) + '">' + fmtDur(total) + '</span> an dieser Aufgabe</p>' +
      '<div class="focus-actions">' +
        '<button type="button" class="btn primary big" data-act="timer" data-id="' + esc(t.id) + '">' + (running ? 'Pause' : 'Timer starten') + ' <kbd>T</kbd></button>' +
        '<button type="button" class="btn big" data-act="done" data-id="' + esc(t.id) + '">Erledigt <kbd>' + MOD + ' ↵</kbd></button>' +
        (t.url ? '<a class="btn big" href="' + esc(t.url) + '" target="_blank" rel="noopener">Quelle öffnen ↗</a>' : '') +
      '</div>' +
      '<label class="focus-notes-label" for="focus-notes">Notizen</label>' +
      '<textarea id="focus-notes" class="focus-notes" data-id="' + esc(t.id) + '" placeholder="Gedanken, nächste Schritte, offene Fragen …">' + esc(t.notes) + '</textarea>' +
    '</div>';
  }

  function viewSettings() {
    var s = S.state.settings;
    var appUrl = location.protocol.indexOf('http') === 0 ? location.origin + location.pathname : '';
    var bookmarklet = appUrl ? "javascript:(function(){var s=String(window.getSelection()||'').slice(0,800);window.open('" + appUrl + "?capture=1&t='+encodeURIComponent(document.title)+'&u='+encodeURIComponent(location.href)+'&s='+encodeURIComponent(s),'kompass');})();" : '';
    var areas = S.areas().map(function (a) {
      return '<li class="area-row">' +
        '<input type="color" id="area-color-' + esc(a.id) + '" value="' + esc(a.color) + '" data-area="' + esc(a.id) + '" data-field="color" aria-label="Farbe" />' +
        '<input type="text" id="area-name-' + esc(a.id) + '" value="' + esc(a.name) + '" data-area="' + esc(a.id) + '" data-field="name" aria-label="Name" />' +
        '<button type="button" class="btn ghost small" data-act="area-del" data-id="' + esc(a.id) + '">Entfernen</button></li>';
    }).join('');
    var used = 0;
    try { used = (localStorage.getItem('kompass.v1') || '').length; } catch (e) { }

    return header('Einstellungen', '') +
      '<section class="card"><h2>Darstellung</h2>' +
        '<div class="seg" role="radiogroup" aria-label="Farbschema">' +
          ['system', 'light', 'dark'].map(function (k) {
            var label = { system: 'Wie Windows', light: 'Hell', dark: 'Dunkel' }[k];
            return '<button type="button" role="radio" aria-checked="' + (s.theme === k) + '" class="seg-btn' + (s.theme === k ? ' is-on' : '') + '" data-act="theme" data-theme-val="' + k + '">' + label + '</button>';
          }).join('') +
        '</div>' +
        '<label class="field"><span>Fokusziel pro Tag (Stunden)</span><input id="set-target" type="number" min="0.5" max="12" step="0.5" value="' + esc(s.dailyFocusTarget) + '" data-setting="dailyFocusTarget" /></label>' +

  function mainHTML() {

    else if (ui.view === 'erledigt') body = viewDone(v);

  // ------------------------------------------------------------------ Overlays

        '</div>' +
        '<div class="field-row">' +
          '<label class="field"><span>Person (Warten auf / Agenda)</span><input id="ed-person" list="people-list2" type="text" value="' + esc(e.person) + '" /></label>' +
          '<label class="field"><span>Nachfassen am</span><input id="ed-follow" type="date" value="' + esc(e.followUp || '') + '" /></label>' +
        '</div>' +
        '<datalist id="people-list2">' + ppl + '</datalist>' +
        '<label class="field"><span>Notizen</span><textarea id="ed-notes" rows="5">' + esc(e.notes) + '</textarea></label>' +
        '<p class="muted small">Erfasst ' + esc(new Date(e.createdAt).toLocaleString('de-DE')) + (S.secondsOnTask(e.id) ? ' · ' + fmtDur(S.secondsOnTask(e.id)) + ' Fokuszeit' : '') + '</p>' +
        '<div class="modal-btns"><button type="button" class="btn ghost danger" data-act="del" data-id="' + esc(e.id) + '">Löschen</button><span class="spacer"></span><button type="button" class="btn ghost" data-act="modal-close">Abbrechen</button><button type="submit" class="btn primary">Speichern</button></div>' +
      '</form>';
    } else if (m.type === 'confirm') {
      inner = '<form class="modal-form" data-act-form="confirm"><h2>' + esc(m.title) + '</h2><p>' + esc(m.text) + '</p>' +
        (m.typeWord ? '<label class="field"><span>Zum Bestätigen „' + esc(m.typeWord) + '“ eingeben</span><input id="confirm-word" type="text" autocomplete="off" /></label>' : '') +
        '<div class="modal-btns"><button type="button" class="btn ghost" data-act="modal-close">Abbrechen</button><button type="submit" class="btn ' + (m.danger ? 'danger-solid' : 'primary') + '">' + esc(m.ok) + '</button></div></form>';
    } else if (m.type === 'help') {
      var rows = [
        [MOD + ' K', 'Suchen und springen'], ['N', 'Neue Aufgabe'], [MOD + ' V', 'Link oder Text in die Inbox einfügen'],

        ['X oder ' + MOD + ' ↵', 'Erledigt'], ['H W S A G I', 'Nach Heute, Woche, Später, Warten, Agenda, Inbox'],
        ['F', 'Fokus auf die Aufgabe'], ['T', 'Timer starten oder stoppen'], ['Entf', 'Löschen (mit Rückgängig)'], ['Esc', 'Schließen, Fokus verlassen']
      ];
      inner = '<div class="modal-form"><h2>Tastenkürzel</h2><table class="keys">' + rows.map(function (r) { return '<tr><td><kbd>' + esc(r[0]) + '</kbd></td><td>' + esc(r[1]) + '</td></tr>'; }).join('') + '</table>' +
        '<p class="muted small">Aufgaben lassen sich per Drag & Drop sortieren oder auf einen Listennamen links ziehen.</p>' +
        '<div class="modal-btns"><button type="button" class="btn primary" data-act="modal-close">Schließen</button></div></div>';
